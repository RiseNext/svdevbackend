# =============================================================================
# PRODUCTION SHAPE — three long-running containers plus a migrate job, from ONE
# image. This file is the reference shape; Railway runs the same four commands
# as four services (see docs/DEPLOYMENT-CHECKLIST.md §3).
#
# 🔴 WHAT A DEAD WORKER COSTS — AND IT IS NO LONGER ENQUIRIES.
# This header used to read "if a worker dies, leads still save, the API still
# returns 201, and ZERO notifications go out". That risk was removed at the
# source rather than monitored: there are no notifications. An enquiry is
# written to Postgres synchronously and read in Admin -> Enquiries, so NO
# ENQUIRY EVER PASSES THROUGH A WORKER and no worker failure can lose one.
#
# What a dead worker now costs, in full:
#   · worker-default      — a failed revalidation is never retried, so a publish
#                           shows up on the website at its next ISR window
#                           instead of immediately. Late, not lost.
#   · worker-maintenance  — the 90-day PII purge and the 30-day media sweep stop.
#                           Nothing breaks the same day; it accrues.
# Both still deserve a liveness alert. Neither is a data-loss event any more.
#
# Secrets come from the platform secret store, never from this file.
# NOTE: there are no mail credentials to store — this product sends no email.
# =============================================================================

services:
  cms:
    image: svbackend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    # READINESS — /healthz, NOT /livez. A /livez probe answers 200 even when the
    # environment is invalid and every real route is returning 500, because
    # /livez deliberately imports none of the Payload config. That was measured
    # on this image, not assumed. See the HEALTHCHECK block in the Dockerfile
    # for the full finding; /livez remains the correct LIVENESS probe.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MIGRATIONS AS A SEPARATE PRE-DEPLOY JOB, never inside N replicas' start-up.
  #
  # Two reasons, both load-bearing:
  #   1. It lets the migrate role differ from the app role. The RUNNING APP HAS
  #      NO DDL; only this job does. An application compromise then cannot
  #      DROP TABLE.
  #   2. It keeps the failure surface at "deployment rejected" rather than
  #      "container crash-loops", which is what `prodMigrations` would give.
  #
  # ⚠️ Concurrent-deploy migration races are undocumented — no migration locking
  # or advisory-lock behaviour is published. SERIALISE DEPLOYS.
  # ---------------------------------------------------------------------------
  migrate:
    image: svbackend:${IMAGE_TAG:-latest}
    restart: 'no'
    env_file: [.env.production]
    environment:
      # The DDL-capable role, used ONLY here.
      #
      # 🔴 ON NEON THIS MUST ALSO BE THE **DIRECT** ENDPOINT, not the pooled one.
      # Neon's pooler is PgBouncer in transaction mode; Payload runs migrations
      # inside a transaction and issues DDL, which transaction pooling does not
      # reliably carry. The app service above keeps the POOLED endpoint.
      # Two independent reasons — least privilege and pooling mode — land on the
      # same split, which is why it costs no extra variable.
      DATABASE_URL: ${MIGRATE_DATABASE_URL}
    command: ['npm', 'run', 'migrate']

  # ---------------------------------------------------------------------------
  # THE JOB WORKERS. Both are scaled to EXACTLY ONE REPLICA.
  #
  # 🔴 `--handle-schedules` APPEARS ON ONE CONTAINER ONLY. The docs call out
  # both footguns by name: using the bin script AND autoRun for the same queue
  # causes duplicate jobs, and multiple servers handling schedules each queue
  # their own. Duplicate `sendLeadNotification` jobs mean the sales team gets
  # the same lead three times.
  #
  # WHO DRAINS WHAT (all FOUR tasks are accounted for — RUNBOOK.md §4b):
  #   worker-default      queue `default`     revalidatePaths
  #                                           — queued by a hook only when a
  #                                             direct revalidation call failed
  #   worker-maintenance  queue `maintenance` purgeLeadPii (daily 21:45 UTC),
  #                                           sweepDeletedMedia (daily 22:15 UTC),
  #                                           watchdogFailedJobs (every 15 min)
  #                                           — queued by `schedule`, which ONLY
  #                                           `--handle-schedules` turns into jobs
  #
  # ⚠️ IT WAS FIVE TASKS. `sendLeadNotification` was removed with the email
  # subsystem: nothing is sent, so nothing is queued for an enquiry.
  #
  # 🔴 worker-maintenance is REQUIRED as of migration 003 — it is the only
  # process that runs `--handle-schedules`, so without it the 90-day PII purge
  # and the 30-day media sweep never run at all.
  #
  # ⚠️ BOTH MUST BE RESTARTED AFTER EVERY DEPLOY, or they keep running the old
  # code against the new schema.
  # ---------------------------------------------------------------------------
  worker-default:
    image: svbackend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    # ENABLE_JOB_WORKERS stays FALSE here: autoRun is the FALLBACK for when a
    # second container is refused on cost, and running both would run every job
    # twice.
    environment:
      ENABLE_JOB_WORKERS: 'false'
    command: ['npx', 'payload', 'jobs:run', '--cron', '* * * * *', '--queue', 'default', '--limit', '25']
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1

  worker-maintenance:
    image: svbackend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      ENABLE_JOB_WORKERS: 'false'
    command:
      ['npx', 'payload', 'jobs:run', '--cron', '*/15 * * * *', '--queue', 'maintenance', '--handle-schedules']
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      # 🔴 NEVER MORE THAN ONE. This is the schedule handler.
      replicas: 1
